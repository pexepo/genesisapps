<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#06060f" />
  <title>Genesis — заявка в юнит</title>
  <meta name="description" content="Genesis — заявка на вступление в юнит эдиторов." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/genesis-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;450;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div id="boot" class="boot" role="status" aria-label="Loading">
    <div class="boot-inner">
      <span class="logo-mark boot-logo"></span>
      <div class="boot-word">GENESIS</div>
      <div class="boot-sub" id="bootSub">establishing uplink</div>
      <div class="boot-bar"><span class="boot-bar-fill"></span></div>
    </div>
  </div>

  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="horizon"></span>
    <span class="streak s1"></span>
    <span class="streak s2"></span>
    <span class="streak s3"></span>
    <span class="streak s4"></span>
    <div class="planet-system">
      <span class="orbit o1"></span>
      <span class="orbit o2"></span>
      <span class="orbit o3"></span>
      <span class="moon-orbit m1"><i class="moon"></i></span>
      <span class="moon-orbit m2"><i class="moon"></i></span>
      <span class="planet">
        <i class="planet-ring"></i>
        <i class="planet-body"></i>
        <i class="planet-flare"></i>
        <i class="planet-atmo"></i>
      </span>
    </div>
    <div class="grid-veil"></div>
  </div>
  <div class="just-bg" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand-mini" href="/" aria-label="Genesis">
      <span class="logo-mark sm"></span>
      <span class="brand-word">GENESIS</span>
    </a>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-opt" data-lang="ru">RU</button>
      <button type="button" class="lang-opt" data-lang="en">EN</button>
      <span class="lang-pill" aria-hidden="true"></span>
    </div>
  </header>

  <main class="stage">
    <section class="card" id="card">
      <!-- Brand / progress panel -->
      <aside class="card-aside">
        <div class="aside-top">
          <span class="logo-mark lg" id="heroLogo"></span>
          <h1 class="brand-title">GENESIS</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>

        <ol class="steps" id="steps">
          <li class="step" data-step="1">
            <span class="step-dot"><span class="step-num">1</span></span>
            <span class="step-label" data-i18n="steps.1"></span>
          </li>
          <li class="step" data-step="2">
            <span class="step-dot"><span class="step-num">2</span></span>
            <span class="step-label" data-i18n="steps.2"></span>
          </li>
          <li class="step" data-step="3">
            <span class="step-dot"><span class="step-num">3</span></span>
            <span class="step-label" data-i18n="steps.3"></span>
          </li>
          <li class="step" data-step="4">
            <span class="step-dot"><span class="step-num">4</span></span>
            <span class="step-label" data-i18n="steps.4"></span>
          </li>
          <span class="steps-track"><span class="steps-fill" id="stepsFill"></span></span>
        </ol>

        <div class="aside-foot">
          <span class="dot-live"></span>
          <span data-i18n="aside.foot"></span>
        </div>
      </aside>

      <!-- Form panel -->
      <div class="card-main">
        <div class="progress-mobile" aria-hidden="true">
          <span class="pm-fill" id="pmFill"></span>
        </div>

        <form id="form" novalidate autocomplete="off">
          <!-- honeypot: hidden from humans -->
          <div class="hp" aria-hidden="true">
            <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
          </div>

          <!-- STEP 1 -->
          <section class="panel" data-panel="1">
            <header class="panel-head">
              <span class="panel-kicker" data-i18n="steps.1"></span>
              <h2 data-i18n="s1.title"></h2>
              <p data-i18n="s1.sub"></p>
            </header>

            <div class="field" data-field="discord">
              <input class="control" id="discord" name="discord" type="text" placeholder=" " maxlength="100" required />
              <label for="discord" data-i18n="f.discord.label"></label>
              <span class="bar"></span>
              <small class="hint" data-i18n="f.discord.hint"></small>
              <small class="err" data-err="discord"></small>
            </div>

            <div class="field field-static" data-field="software">
              <span class="field-title" data-i18n="f.software.label"></span>
              <small class="hint" data-i18n="f.software.hint"></small>
              <div class="chips" data-chips="software" data-max="2" role="group">
                <button type="button" class="chip" data-val="After Effects">After Effects</button>
                <button type="button" class="chip" data-val="DaVinci Resolve">DaVinci Resolve</button>
                <button type="button" class="chip" data-val="Alight Motion">Alight Motion</button>
                <button type="button" class="chip" data-val="Node Video">Node Video</button>
                <button type="button" class="chip" data-val="CapCut">CapCut</button>
                <button type="button" class="chip" data-val="__other" data-i18n="f.software.other"></button>
              </div>
              <input class="control control-inline" id="software_other" name="software_other" type="text" placeholder=" " maxlength="60" hidden />
              <label class="inline-label" for="software_other" data-i18n="f.software.otherLabel"></label>
              <input type="hidden" id="software" name="software" />
              <small class="err" data-err="software"></small>
            </div>

            <div class="field field-static" data-field="extra">
              <span class="field-title">
                <span data-i18n="f.extra.label"></span>
                <span class="opt-tag" data-i18n="f.optional"></span>
              </span>
              <small class="hint" data-i18n="f.extra.hint"></small>
              <div class="chips" data-chips="extra" data-max="2" role="group">
                <button type="button" class="chip" data-val="Blender">Blender</button>
                <button type="button" class="chip" data-val="Cinema 4D">Cinema 4D</button>
                <button type="button" class="chip" data-val="Houdini">Houdini</button>
                <button type="button" class="chip" data-val="Element 3D">Element 3D</button>
                <button type="button" class="chip" data-val="__other" data-i18n="f.software.other"></button>
              </div>
              <input class="control control-inline" id="extra_other" name="extra_other" type="text" placeholder=" " maxlength="60" hidden />
              <input type="hidden" id="extra" name="extra" />
              <small class="err" data-err="extra"></small>
            </div>
          </section>

          <!-- STEP 2 -->
          <section class="panel" data-panel="2" hidden>
            <header class="panel-head">
              <span class="panel-kicker" data-i18n="steps.2"></span>
              <h2 data-i18n="s2.title"></h2>
              <p data-i18n="s2.sub"></p>
            </header>

            <div class="field" data-field="experience">
              <input class="control" id="experience" name="experience" type="text" placeholder=" " maxlength="120" required />
              <label for="experience" data-i18n="f.experience.label"></label>
              <span class="bar"></span>
              <small class="hint" data-i18n="f.experience.hint"></small>
              <small class="err" data-err="experience"></small>
            </div>

            <div class="field" data-field="goal">
              <textarea class="control" id="goal" name="goal" placeholder=" " maxlength="600" rows="3" required></textarea>
              <label for="goal" data-i18n="f.goal.label"></label>
              <span class="bar"></span>
              <div class="row-between">
                <small class="hint" data-i18n="f.goal.hint"></small>
                <small class="counter" data-counter="goal">0 / 600</small>
              </div>
              <small class="err" data-err="goal"></small>
            </div>
          </section>

          <!-- STEP 3 -->
          <section class="panel" data-panel="3" hidden>
            <header class="panel-head">
              <span class="panel-kicker" data-i18n="steps.3"></span>
              <h2 data-i18n="s3.title"></h2>
              <p data-i18n="s3.sub"></p>
            </header>

            <div class="field" data-field="best">
              <input class="control" id="best" name="best" type="url" inputmode="url" placeholder=" " maxlength="300" required />
              <label for="best" data-i18n="f.best.label"></label>
              <span class="bar"></span>
              <small class="hint" data-i18n="f.best.hint"></small>
              <small class="err" data-err="best"></small>
            </div>

            <div class="field" data-field="social">
              <input class="control" id="social" name="social" type="url" inputmode="url" placeholder=" " maxlength="300" />
              <label for="social">
                <span data-i18n="f.social.label"></span>
                <span class="opt-tag" data-i18n="f.optional"></span>
              </label>
              <span class="bar"></span>
              <small class="hint" data-i18n="f.social.hint"></small>
              <small class="err" data-err="social"></small>
            </div>
          </section>

          <!-- STEP 4 — review -->
          <section class="panel" data-panel="4" hidden>
            <header class="panel-head">
              <span class="panel-kicker" data-i18n="steps.4"></span>
              <h2 data-i18n="s4.title"></h2>
              <p data-i18n="s4.sub"></p>
            </header>
            <dl class="review" id="review"></dl>
          </section>

          <div class="form-nav">
            <button type="button" class="btn ghost" data-action="back">
              <span class="ico">←</span><span data-i18n="nav.back"></span>
            </button>
            <span class="nav-spacer"></span>
            <button type="button" class="btn primary" data-action="next">
              <span data-i18n="nav.next"></span><span class="ico">→</span>
            </button>
            <button type="submit" class="btn primary submit" data-action="submit" hidden>
              <span class="btn-label" data-i18n="nav.submit"></span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </div>

          <p class="form-error" id="formError" role="alert" hidden></p>
        </form>

        <!-- success -->
        <div class="done" id="done" hidden>
          <div class="done-burst" aria-hidden="true"></div>
          <div class="check">
            <svg viewBox="0 0 52 52" width="68" height="68" aria-hidden="true">
              <circle class="check-ring" cx="26" cy="26" r="24" fill="none" />
              <path class="check-mark" fill="none" d="M14 27 l8 8 l16 -18" />
            </svg>
          </div>
          <h2 data-i18n="done.title"></h2>
          <p data-i18n="done.sub"></p>
          <button type="button" class="btn ghost" id="againBtn" data-i18n="done.again"></button>
        </div>
      </div>
    </section>

    <footer class="site-foot">
      <nav class="foot-links">
        <a class="foot-link" href="https://discord.gg/GfVUWdbanx" target="_blank" rel="noopener noreferrer">
          <span class="foot-ico">▸</span><span data-i18n="foot.server"></span>
        </a>
        <button type="button" class="foot-link" data-modal="styles">
          <span class="foot-ico">▸</span><span data-i18n="foot.styles"></span>
        </button>
      </nav>
      <p class="foot-contact" id="footContact"></p>
      <p class="legal" data-i18n="legal"></p>
    </footer>
  </main>

  <!-- modal (application rules) -->
  <div class="modal" id="modal" hidden>
    <div class="modal-scrim" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" class="modal-x" data-close aria-label="Close">✕</button>
      <span class="panel-kicker" id="modalKicker"></span>
      <h2 id="modalTitle"></h2>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
